# docker-compose.test.yml
version: '3.8'

services:
  postgres_test:
    image: postgres:15
    environment:
      POSTGRES_DB: financial_advisor_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"
    tmpfs: /var/lib/postgresql/data  # In-memory for speed

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no  # No persistence

  wiremock:
    image: wiremock/wiremock:3.5.0
    ports:
      - "8081:8080"
    volumes:
      - ./tests/mocks:/home/wiremock/mappings
    command: --verbose

  sut:
    build: .
    environment:
      DATABASE_URL: postgresql://test_user:test_pass@postgres_test:5432/financial_advisor_test
      REDIS_URL: redis://redis_test:6379
      ALPHA_VANTAGE_URL: http://wiremock:8080
      FRED_URL: http://wiremock:8080
      NEWSAPI_URL: http://wiremock:8080
      USE_MODEL_STUBS: "true"
    depends_on:
      - postgres_test
      - redis_test
      - wiremock
    ports:
      - "8001:8000"